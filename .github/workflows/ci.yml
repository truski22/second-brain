name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: second-brain
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tenet-harness
          path: tenet-harness
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra voice
        working-directory: second-brain
      - run: uv run ruff check src tests scripts
        working-directory: second-brain
      - run: uv run pytest -q
        working-directory: second-brain
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test --if-present && npm run lint && npm run build
        working-directory: frontend
