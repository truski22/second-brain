[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "Local-first desktop assistant built on tenet-harness"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "tenet-harness[integrations]",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "langchain-core>=1.6,<2",
  "langchain-ollama>=1.1,<2",
  "langchain-chroma>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "chromadb>=1.5,<2",
  "dateparser>=1.2,<2",
  "tzdata>=2025.1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
voice = ["openai-whisper>=20250625", "piper-tts>=1.3,<2",
         "huggingface-hub>=0.30,<2", "imageio-ffmpeg>=0.6,<1"]

[tool.uv.sources]
# Local development against a sibling checkout; CI and releases use a tagged git dependency.
tenet-harness = { path = "../tenet-harness", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6,<7"]

[project.scripts]
second-brain = "second_brain_app.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
